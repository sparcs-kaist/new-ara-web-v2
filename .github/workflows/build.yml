name: Build and Lint Next.js

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  reject-invalid-pr-source:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if PR to main is not from dev
        run: |
          echo "🔍 PR target: ${{ github.base_ref }}"
          echo "🔍 PR source: ${{ github.head_ref }}"
          if [[ "${{ github.base_ref }}" == "main" && "${{ github.head_ref }}" != "dev" ]]; then
            echo "❌ PR to 'main' must come from 'dev' branch."
            exit 1
          fi

  build-and-lint:
    if: ${{ !cancelled() && (needs.reject-invalid-pr-source.result == 'success' || needs.reject-invalid-pr-source.result == 'skipped') }}
    runs-on: ubuntu-latest
    needs: reject-invalid-pr-source  # 이전 검사 통과해야 실행됨

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Use npm
        run: npm install --global npm@12.2.2 --no-audit --no-fund

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Editor regression tests
        run: npm test

      - name: Keyboard package checks
        run: |
          npm run typecheck:package
          npm run test:package
          npm run build:package

      - name: Build
        run: npm run build
